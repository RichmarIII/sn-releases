name: Feature request
description: Suggest an improvement to Sn or its official toolchain.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the development problem and the behavior that would help.
        This issue is public. Do not include private project source or confidential information.
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What are you trying to build, and what gets in your way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the change or workflow you want.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: textarea
    id: context
    attributes:
      label: Additional context
